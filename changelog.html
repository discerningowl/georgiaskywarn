<!--
  ──────────────────────────────────────────────────────────────
  File:   changelog.html
  Author: Georgia SKYWARN Development Team
  Purpose: Full site changelog history, grouped by year. about.html
           shows only the most recent entries (CONFIG.UI.CHANGELOG_RECENT_COUNT)
           and links here for everything older.
  Change-log:
    • 2026-06-30 – Created. Replaces the "View Older Updates" modal on
      about.html, which didn't scale as history grew (no deep links,
      no SEO, unbounded content in a small box).
  ──────────────────────────────────────────────────────────────
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Essential meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Georgia SKYWARN - Site Changelog</title>
  <meta name="description" content="Complete history of updates to the Georgia SKYWARN website, grouped by year.">
  <meta name="author" content="Jack Parks (KQ4JP)">
  <link rel="canonical" href="https://georgiaskywarn.com/changelog.html">

  <!-- Security headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Open Graph for social media sharing -->
  <meta property="og:title" content="Georgia SKYWARN - Site Changelog">
  <meta property="og:description" content="Complete history of updates to the Georgia SKYWARN website, grouped by year.">
  <meta property="og:image" content="https://georgiaskywarn.com/assets/og-image.png">
  <meta property="og:url" content="https://georgiaskywarn.com/changelog.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Georgia SKYWARN">

  <!-- Stylesheet and favicon -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

  <!-- Structured data for AI search and rich results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Georgia SKYWARN - Site Changelog",
    "description": "Complete history of updates to the Georgia SKYWARN website, grouped by year.",
    "url": "https://georgiaskywarn.com/changelog.html",
    "isPartOf": { "@id": "https://georgiaskywarn.com/#website" }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://georgiaskywarn.com/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "About",
        "item": "https://georgiaskywarn.com/about.html"
      },
      {
        "@type": "ListItem",
        "position": 3,
        "name": "Changelog",
        "item": "https://georgiaskywarn.com/changelog.html"
      }
    ]
  }
  </script>

</head>

<body>
  <!-- Header and all scripts loaded via js/loader.js at bottom of page -->

  <!-- Page navigation (sticky horizontal bar) -->
  <!-- NOTE: years are static, not JS-generated — scripts.js wires up scroll-spy
       and the mobile toggle before changelog.js runs, so the #y{year} target
       elements (and their nav links) must already exist in the DOM. Add a new
       <li> + <div id="yYYYY"></div> pair each time a new year's first entry
       is added to data/changelog.json. See CLAUDE.md "Adding a Changelog Year". -->
  <nav class="page-nav" role="navigation" aria-label="Page navigation">
    <button class="page-nav-toggle" aria-expanded="false" aria-controls="page-nav-list">☰ PAGE</button>
    <ul id="page-nav-list" class="nav-list">
      <li><a href="#y2026">2026</a></li>
      <li><a href="#y2025">2025</a></li>
    </ul>
  </nav>

  <!-- Main content area (ARIA landmark) -->
  <main class="site-main" role="main">

    <section class="card">
      <header class="card-header"><h2>Site Changelog</h2></header>
      <div class="card-body">
        <p>
          Complete history of updates to the Georgia SKYWARN website, grouped by year. For
          just the latest changes, see the <a href="about.html#changelog">recent updates</a>
          on the About page.
        </p>
      </div>
    </section>

    <!-- Full history (dynamically loaded from changelog.json into the year
         containers below by js/changelog.js) -->
    <div id="changelogHistory">
      <div id="y2026"></div>
      <div id="y2025"></div>
    </div>

  </main>

  <!-- Site footer - calls on footer.html via script-->
  <div id="footer-placeholder"></div>

<!-- Centralized script loading - to update cache, only edit js/version.js -->
<script src="js/version.js"></script>
<script src="js/loader.js"></script>

</body>
</html>
